<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Diwali WebAR - Shriram Rath & Floating Lanterns</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
    
    #webcam {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    #ar-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    #ui-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(16px, 3vw, 24px);
      pointer-events: none;
    }

    .header-text {
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.8), 0 0 24px rgba(255, 140, 0, 0.6);
      font-family: 'Comic Relief', 'Segoe UI', sans-serif;
      font-size: clamp(1.1rem, 2.6vw, 1.8rem);
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      margin-top: clamp(12px, 2vh, 22px);
      max-width: min(90vw, 520px);
      line-height: 1.2;
    }

    .start-btn {
      pointer-events: auto;
      background: linear-gradient(135deg, #ff8c00, #e60000);
      color: #fff;
      border: 2px solid #ffd700;
      padding: clamp(10px, 2vw, 14px) clamp(18px, 5vw, 32px);
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      font-weight: 700;
      border-radius: 50px;
      box-shadow: 0 0 20px rgba(255, 140, 0, 0.8);
      cursor: pointer;
      margin-bottom: clamp(16px, 3vh, 28px);
      font-family: 'Comic Relief', 'Segoe UI', sans-serif;
    }

    #orientation-hint,
    #signature-text {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #orientation-hint {
      top: 18%;
      width: min(88vw, 560px);
      padding: 10px 16px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 215, 0, 0.4);
      color: #fff3bf;
      font-size: clamp(0.75rem, 1.8vw, 1rem);
      font-weight: 600;
      line-height: 1.4;
      backdrop-filter: blur(2px);
      opacity: 1;
      transition: opacity 0.75s ease, transform 0.75s ease;
    }

    #orientation-hint.fade-out {
      opacity: 0;
      transform: translateX(-50%) translateY(-8px);
    }

    #orientation-hint.visible,
    #signature-text.visible {
      opacity: 1;
    }

    #signature-text {
      bottom: 11vh;
      width: min(90vw, 520px);
      color: #ffd700;
      font-size: clamp(0.9rem, 2vw, 1.15rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-shadow: 0 0 12px rgba(255, 210, 70, 0.7);
      display: none;
      font-family: 'Edu NSW ACT Cursive', cursive;
    }

    @media (orientation: landscape) and (max-height: 500px) {
      #ui-container {
        padding-top: 10px;
        padding-bottom: 12px;
      }

      .header-text {
        margin-top: 6px;
      }

      .start-btn {
        margin-bottom: 10px;
      }

      #orientation-hint {
        top: 12%;
      }

      #signature-text {
        bottom: 8vh;
      }
    }
  </style>
  
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="ar-canvas"></canvas>

  <div id="ui-container">
    <div class="header-text">🪔 Shubh Diwali 🪔<br></div>
    <button class="start-btn" id="start-btn" onclick="initExperience()">Tap to Experience Arrival</button>
  </div>

  <div id="orientation-hint">For the best experience, briefly turn your phone to landscape, point it at an empty wall, and enjoy the arrival.</div>
  <div id="signature-text">From Namrata, Ashutosh and Ananya</div>

  <script src="index.js"></script>
</body>
</html>
