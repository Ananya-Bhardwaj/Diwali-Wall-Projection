<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Diwali WebAR - Shriram Rath & Floating Lanterns</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
    
    #webcam {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    #ar-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    #ui-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(16px, 3vw, 24px);
      pointer-events: none;
    }

    .header-text {
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.8), 0 0 24px rgba(255, 140, 0, 0.6);
      font-size: clamp(1.1rem, 2.6vw, 1.8rem);
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      margin-top: clamp(12px, 2vh, 22px);
      max-width: min(90vw, 520px);
      line-height: 1.2;
    }

    .header-text .subtitle {
      display: block;
      font-size: clamp(0.72rem, 1.8vw, 0.95rem);
      font-weight: 400;
      color: #fff;
      margin-top: 6px;
    }

    .start-btn {
      pointer-events: auto;
      background: linear-gradient(135deg, #ff8c00, #e60000);
      color: #fff;
      border: 2px solid #ffd700;
      padding: clamp(10px, 2vw, 14px) clamp(18px, 5vw, 32px);
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      font-weight: 700;
      border-radius: 50px;
      box-shadow: 0 0 20px rgba(255, 140, 0, 0.8);
      cursor: pointer;
      margin-bottom: clamp(16px, 3vh, 28px);
    }

    @media (orientation: landscape) and (max-height: 500px) {
      #ui-container {
        padding-top: 10px;
        padding-bottom: 12px;
      }

      .header-text {
        margin-top: 6px;
      }

      .start-btn {
        margin-bottom: 10px;
      }
    }
  </style>
  
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="ar-canvas"></canvas>

  <div id="ui-container">
    <div class="header-text">🪔 Shubh Diwali 🪔<br><span style="font-size:0.9rem; font-weight:400; color:#fff;">Point your camera towards the balcony/sky</span></div>
    <button class="start-btn" id="start-btn" onclick="initExperience()">Tap to Experience Arrival</button>
  </div>

  <script src="index.js"></script>
</body>
</html>
